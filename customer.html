<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartPark — Customer Dashboard</title>
    <meta name="smartpark-api-url" content="">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter','Poppins','sans-serif'] }, colors: { sp: { primary:'#0B1426', secondary:'#111B33', card:'#152238', accent:'#3B82F6', emerald:'#10B981', purple:'#8B5CF6', cyan:'#06B6D4' } } } } }
    </script>
</head>
<body class="font-sans bg-sp-primary text-slate-100 min-h-screen">
<script>const token = localStorage.getItem('token_customer'); if(!token){window.location.href='index.html';} try{if(token.startsWith('static-')){const u=JSON.parse(localStorage.getItem('loggedInUser_customer')||'{}'); if(u.role!=='customer'&&u.role!=='user'){window.location.href='index.html';}} }catch(e){window.location.href='index.html';}</script>
<header class="bg-sp-secondary/90 backdrop-blur-xl border-b border-sp-accent/10 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6"><div class="flex items-center justify-between h-16">
        <div class="flex items-center gap-3">
            <a href="book-parking.html" class="flex items-center gap-2.5 no-underline">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-sp-accent to-sp-emerald flex items-center justify-center shadow-lg"><i class="fa-solid fa-square-p text-white text-lg"></i></div>
                <div><span class="text-lg font-extrabold tracking-wider text-gradient">SmartPark</span><span class="block text-[9px] text-slate-500 font-semibold tracking-widest uppercase leading-none">AI Parking</span></div>
            </a>
        </div>
        <div class="flex items-center gap-3">
            <a href="my-sessions.html" class="px-4 py-2 text-sm font-medium rounded-lg text-slate-400 hover:text-white hover:bg-white/5 transition-all"><i class="fa-solid fa-car-side mr-1.5"></i>My Sessions</a>
            <a href="#" onclick="logout(); return false;" class="px-3.5 py-2 text-xs font-semibold bg-red-500/10 hover:bg-red-500/20 text-red-400 hover:text-red-300 rounded-xl transition-all border border-red-500/20 no-underline"><i class="fa-solid fa-right-from-bracket"></i> Sign Out</a>
        </div>
    </div></div>
</header>
<main class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
    <div class="text-center py-20">
        <div class="w-20 h-20 rounded-full bg-sp-accent/10 flex items-center justify-center mx-auto mb-6"><i class="fa-solid fa-car text-sp-accent text-3xl"></i></div>
        <h1 class="text-3xl font-extrabold text-white mb-3">Customer Dashboard</h1>
        <p class="text-slate-400 mb-8">Welcome to your SmartPark customer portal. Use the navigation above to manage your parking.</p>
        <div class="flex flex-col sm:flex-row gap-4 justify-center">
            <a href="book-parking.html" class="btn-primary py-3 px-8 text-base"><i class="fa-solid fa-calendar-check mr-2"></i> Find Parking</a>
            <a href="my-sessions.html" class="btn-secondary py-3 px-8 text-base"><i class="fa-solid fa-car-side mr-2"></i> My Sessions</a>
        </div>
    </div>
</main>
<script src="script.js"></script>
</body>
</html>
